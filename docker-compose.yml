version: "3.8"
services:
  hapi:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      - HAPI_PORT=8080
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/app:/app
    ports:
      - "8000:8000"
    environment:
      - HAPI_BASE_URL=http://hapi:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
    depends_on:
      - hapi

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/usr/src/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  apify:
    build:
      context: ./apify
    volumes:
      - ./apify:/usr/src/apify
    environment:
      - APIFY_TOKEN=${APIFY_TOKEN}
    command: ["node", "actor/main.js"]
